<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ex3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>color</h1>
        <h2>named colors</h2>
        <div class="named-red"></div>
        <div class="named-blue"></div>
        <div class="named-gold"></div>
        <h2>HEX colors</h2>
        <div class="hex-red"></div>
        <div class="hex-blue"></div>
        <div class="hex-gold"></div>
        <h2>rgb colors</h2>
        <div class="rgb-red"></div>
        <div class="rgb-blue"></div>
        <div class="rgb-gold"></div>
        <h2>rgba colors</h2>
        <div class="rgba-red5"></div>
        <div class="rgba-red7"></div>
        <div class="rgba-red8"></div>
        <h2>rgba vs opacity</h2>
        <p>rgba-0.5</p>
        <div class="rgba-red5"></div>
        <p>opacity-red-0.5</p>
        <div class="opacity-red"></div>
        <p>
            opacity applies to the whole element, so the text and every child fade with it. rgba() only changes the alpha of that one color, so only the background is see-through.
        </p>



</body>
</html>
